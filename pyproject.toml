[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "reveilio"
version = "0.1.1"
description = "LLM-powered resume vs. job-description matching and scoring library."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Reveilio" }]
keywords = ["resume", "recruitment", "llm", "hr", "ats", "job-description"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2",
    "python-docx>=1.0",
    "PyPDF2>=3.0",
    "httpx>=0.25",
    "openai>=1.0",
    "google-genai>=0.3",
    "reportlab>=4.0",
]

[project.optional-dependencies]
postgresql = ["psycopg2-binary>=2.9"]
mysql = ["PyMySQL>=1.1"]
mongodb = ["pymongo>=4.6"]
all-db = [
    "psycopg2-binary>=2.9",
    "PyMySQL>=1.1",
    "pymongo>=4.6",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "build",
    "twine",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/roosterhr/reveilio"
Issues = "https://github.com/roosterhr/reveilio/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reveilio"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # allow function calls in argument defaults (pydantic)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
